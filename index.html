<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>my music phases</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
<style>
:root{--paper:#f5f1ea;--ink:#2f2e33;--soft:#77746f;--line:rgba(47,46,51,.18);--tape:rgba(216,194,138,.55)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:300 21px/1.5 'Cormorant Garamond',Georgia,serif;
 background-image:linear-gradient(rgba(255,255,255,.35),rgba(255,255,255,0))}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;margin:0;font-weight:400}
header{max-width:1000px;margin:0 auto;padding:88px 32px 32px}
h1{font-size:clamp(52px,9vw,96px);line-height:.95;font-style:italic;font-weight:300;letter-spacing:-.01em}
header p{max-width:40ch;margin:18px 0 30px;color:var(--soft);font-size:22px}
button{font:italic 400 19px 'Cormorant Garamond',serif;color:var(--ink);background:transparent;border:1px solid var(--ink);border-radius:999px;
 padding:7px 24px;margin:0 10px 10px 0;cursor:pointer;transition:background .2s,color .2s}
button:hover,button:focus-visible{background:var(--ink);color:var(--paper);outline:none}
button.alt{border-color:var(--line);color:var(--soft)}
button.alt:hover,button.alt:focus-visible{border-color:var(--ink);color:var(--paper)}
#status{min-height:1.5em;font:500 19px 'Caveat',cursive;color:var(--soft)}
main{max-width:1000px;margin:0 auto;padding:0 32px 120px}
section.year{display:grid;grid-template-columns:170px 1fr;column-gap:40px;margin-top:72px;padding-top:36px;border-top:1px solid var(--line)}
section.year>*:not(.yh){grid-column:2}
.yh{grid-column:1;grid-row:1/span 4;align-self:start;position:sticky;top:28px}
.yh h2{font-size:78px;line-height:1;font-weight:300;font-style:italic}
.yh span{display:block;margin-top:6px;font:500 19px 'Caveat',cursive;color:var(--soft)}
.polas{display:flex;flex-wrap:wrap;gap:26px;margin:4px 0 34px}
.pola{position:relative;width:132px;background:#fffefb;padding:7px 7px 30px;box-shadow:0 1px 1px rgba(47,46,51,.12),0 12px 20px -14px rgba(47,46,51,.45)}
.pola:nth-child(odd){transform:rotate(-1.6deg)}.pola:nth-child(even){transform:rotate(1.2deg)}.pola:nth-child(3n){transform:rotate(-.5deg)}
.pola::before{content:"";position:absolute;top:-9px;left:50%;width:46px;height:16px;margin-left:-23px;background:var(--tape);transform:rotate(-2deg)}
.pola i{display:block;aspect-ratio:1;background-size:cover;background-position:center}
.pola b{position:absolute;left:8px;right:8px;bottom:5px;font:500 17px 'Caveat',cursive;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;color:var(--soft)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:48px}
.card h3{font-size:26px;font-style:italic;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;margin:9px 0;font-size:19px}
.bar em{flex:0 0 40%;font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar u{display:block;height:3px;border-radius:3px;text-decoration:none;position:relative}
.bar u::after{content:"";position:absolute;right:-3px;top:-2px;width:7px;height:7px;border-radius:50%;background:inherit}
.bar small{color:var(--soft);font-size:16px}
.notes{margin-top:28px;display:flex;flex-wrap:wrap;gap:14px}
.note{padding:10px 16px 11px;font:500 22px/1.15 'Caveat',cursive;background:#e4ddc6;box-shadow:0 10px 16px -12px rgba(47,46,51,.5)}
.note:nth-child(even){background:#e6d3d0;transform:rotate(1deg)}.note:nth-child(odd){transform:rotate(-1deg)}
.note:nth-child(3n){background:#d6e0d3}
.empty{color:var(--soft);font-style:italic}
p.empty{max-width:60ch}
#strip{display:flex;gap:10px 22px;flex-wrap:wrap;margin-top:34px}
.chip{font-size:19px;color:var(--soft);font-style:italic}
.chip b{font:500 22px 'Caveat',cursive;font-style:normal;color:var(--ink);margin-right:6px}
.months{margin-top:40px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px 28px}
.m{border-top:1px solid var(--line);padding-top:6px}
.m small{display:block;font:500 17px 'Caveat',cursive;color:var(--soft)}
.m span{display:block;font-style:italic;font-size:21px;line-height:1.2}
.m.none span{color:var(--line)}
nav[hidden]{display:none}
nav,.chips{display:flex;gap:6px 24px;flex-wrap:wrap}
nav{margin:8px 0 10px}.chips{margin-bottom:6px}
.tab{background:none;border:0;border-bottom:1px solid transparent;border-radius:0;padding:2px 0;margin:0;font:italic 400 22px 'Cormorant Garamond',serif;color:var(--soft)}
.tab:hover,.tab:focus-visible{background:none;color:var(--ink);transform:none}
.tab.on{color:var(--ink);border-bottom-color:var(--ink)}
.sea .yh h2{font-size:54px;text-transform:capitalize}
.pls{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:34px 40px;padding-top:6px}
.pl{display:flex;gap:20px;align-items:center}
.pl .pola{flex:0 0 112px;width:112px}
.pl h3{font-size:27px;font-style:italic;line-height:1.1;margin-bottom:2px}
.pl .when{font:500 18px 'Caveat',cursive;color:var(--soft)}
.pl p{margin:4px 0 0;font-size:18px;color:var(--soft)}
#strip:empty{display:none}
.chips{margin-top:4px}
.chips+section.year{margin-top:36px}
@media(max-width:760px){section.year{grid-template-columns:1fr}section.year>*:not(.yh),.yh{grid-column:1}.yh{position:static;grid-row:auto;margin-bottom:14px}.cols{grid-template-columns:1fr;gap:28px}}
@media(prefers-reduced-motion:reduce){button{transition:none}}
</style>
</head>
<body>
<header>
  <h1>my music<br>phases</h1>
  <p>Every song you saved, gathered into the eras of your life.</p>
  <button id="login">connect spotify</button>
  <nav id="nav" hidden><button class="tab on" data-v="years">years</button><button class="tab" data-v="seasons">seasons</button><button class="tab" data-v="playlists">playlists</button></nav>
  <div id="status"></div>
  <div id="strip"></div>
</header>
<main id="out"></main>

<script>
// ---- config ----
const CLIENT_ID = 'd13df075a26a4103a5994a161e96c626';
const REDIRECT = location.origin + location.pathname.replace(/index\.html$/,'');   // add this exact URL in the Spotify dashboard
const SCOPES = 'user-library-read playlist-read-private playlist-read-collaborative';
const $ = s => document.querySelector(s);
const status = t => $('#status').textContent = t;
const PALETTE = ['#a9b8a3','#d9b8b4','#d8c28a','#9fb3c2','#b8aac6','#d4b394'];

// ---- spotify login (PKCE, no server, nothing stored) ----
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
async function login(){
  const verifier = b64(crypto.getRandomValues(new Uint8Array(48)));
  sessionStorage.setItem('v', verifier);
  const challenge = b64(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
  location = 'https://accounts.spotify.com/authorize?' + new URLSearchParams({
    client_id:CLIENT_ID, response_type:'code', redirect_uri:REDIRECT, scope:SCOPES,
    code_challenge_method:'S256', code_challenge:challenge});
}
async function exchange(code){
  const r = await fetch('https://accounts.spotify.com/api/token',{method:'POST',
    headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body:new URLSearchParams({client_id:CLIENT_ID,grant_type:'authorization_code',code,
      redirect_uri:REDIRECT,code_verifier:sessionStorage.getItem('v')})});
  if(!r.ok) throw new Error('Spotify login failed. Check the redirect URI in your dashboard.');
  return (await r.json()).access_token;
}
let token;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let lastCall=0;
async function api(path){
  for(let i=0;i<6;i++){
    const gap=Date.now()-lastCall; if(gap<150) await sleep(150-gap);   // pace requests so we stay under Spotify's limit
    lastCall=Date.now();
    const r = await fetch(path.startsWith('http')?path:'https://api.spotify.com/v1'+path,{headers:{Authorization:'Bearer '+token}});
    if(r.status===429){
      const body=await r.text().catch(()=>'');
      if(body.includes('QUOTA_EXCEEDED')){
        const e=new Error("Spotify says this app's usage quota is used up. It can take many hours to reset, often until the next day, and retrying makes it worse. Nothing is wrong with your setup, so please try again later.");
        e.quota=true; throw e;
      }
      const wait=+r.headers.get('Retry-After')||5*(i+1);
      if(wait>90) throw new Error(`Spotify is asking us to wait about ${Math.ceil(wait/60)} minutes. Try again then.`);
      status(`Spotify asked us to slow down, waiting ${wait} seconds…`);
      await sleep((wait+1)*1000); continue;
    }
    if(!r.ok) throw new Error('Spotify said '+r.status+' for '+path.split('?')[0]);
    return r.json();
  }
  throw new Error('Spotify is still rate limiting us. Wait a few minutes, then connect again.');
}

// ---- load real data ----
const store={get(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
async function loadReal(){
  const cached=(store.get('lk')||[]).map(t=>({...t,added:new Date(t.added)}));
  const known=new Set(cached.map(t=>t.added.getTime()+'|'+t.name));
  const fresh=[]; let url='/me/tracks?limit=50', caughtUp=false;
  while(url&&!caughtUp){                     // newest first, so stop at the first song we already have
    const d=await api(url);
    for(const it of d.items){
      const t=it.track; if(!t) continue;
      const row={added:new Date(it.added_at),name:t.name,artist:t.artists[0].name,aid:t.artists[0].id,img:t.album.images.slice(-2)[0]?.url};
      if(known.has(row.added.getTime()+'|'+row.name)){caughtUp=true;break}
      fresh.push(row);
    }
    status(`reading your liked songs… ${fresh.length+cached.length}`);
    url=d.next;
  }
  const tracks=[...fresh,...cached];
  store.set('lk',tracks);                    // only saved after a complete load
  return {tracks,genres:{},genresOk:false};  // genres come from MusicBrainz (Spotify no longer returns them)
}

// ---- analysis ----
const tally=(arr,f)=>{const m={};arr.forEach(x=>{const k=f(x);if(k)(Array.isArray(k)?k:[k]).forEach(v=>m[v]=(m[v]||0)+1)});return Object.entries(m).sort((a,b)=>b[1]-a[1])};
const dayKey=d=>d.toISOString().slice(0,10);
const month=d=>d.toLocaleString('en',{month:'short'});

// ---- render ----
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function cover(t,i){
  const bg=t.img?`url(${t.img})`:PALETTE[(t.artist.length+i)%6];
  return `<div class="pola"><i style="background:${bg};background-size:cover"></i><b>${esc(t.artist)}</b></div>`;
}
function renderYears({tracks,genres,genresOk,loading}){
  const gOf=mkGOf(genres);
  const years=[...new Set(tracks.map(t=>t.added.getFullYear()))].sort((a,b)=>b-a);
  const perDay={}; tracks.forEach(t=>{const k=dayKey(t.added);perDay[k]=(perDay[k]||0)+1});
  const bulk=Object.entries(perDay).filter(([,n])=>n>=25);
  const bulkSet=new Set(bulk.map(b=>b[0]));
  const reg=tracks.filter(t=>!bulkSet.has(dayKey(t.added))); let strip='', html='';
  if(!genresOk) html+=`<p class="empty">${loading?'Looking up genres, one artist at a time. They will appear here shortly.':'No genre data was available, so the genre charts are skipped.'}</p>`;
  years.forEach(y=>{
    const ts=tracks.filter(t=>t.added.getFullYear()===y);
    const topA=tally(ts,t=>t.artist).slice(0,8), topG=genresOk?tally(ts,gOf).slice(0,8):[];
    if(topG[0]) strip+=`<span class="chip"><b>${y}</b>${topG.slice(0,3).map(g=>esc(g[0])).join(', ')}</span>`;
    const picks=topA.map(([a])=>ts.find(t=>t.artist===a));
    const topIn=m=>{const r=tally(reg.filter(t=>t.added.getFullYear()===y&&t.added.getMonth()===m),t=>t.artist)[0];return r&&r[0]};
        const maxG=topG[0]?.[1]||1, maxA=topA[0][1];
    const bars=(rows,max,off)=>rows.map(([n,c],i)=>`<div class="bar"><em>${esc(n)}</em><u style="width:${Math.max(6,c/max*52)}%;background:${PALETTE[(i+off)%6]}"></u><small>${c}</small></div>`).join('');
    html+=`<section class="year"><div class="yh"><h2>${y}</h2><span>${ts.length} songs saved</span></div>
      <div class="polas">${picks.map(cover).join('')}</div>
      <div class="cols">
        <div class="card"><h3>most saved</h3>${bars(topA,maxA,0)}</div>
        <div class="card"><h3>genres</h3>${topG.length?bars(topG,maxG,2):'<span class="empty">no genre data</span>'}</div>
      </div>
      <div class="card months"><h3>month by month</h3><div class="mgrid">${[...Array(12).keys()].map(m=>{const a=topIn(m);return `<div class="m${a?'':' none'}"><small>${month(new Date(y,m,1))}</small><span>${a?esc(a):'–'}</span></div>`}).join('')}</div></div>
    </section>`;
  });
  $('#strip').innerHTML=strip; $('#out').innerHTML=html||'<p class="empty">No liked songs found yet. Like a few songs and come back!</p>';
  status(`${tracks.length} songs, ${years.at(-1)} to ${years[0]}`);
}

// ---- seasons page ----
const SEAS=['winter','spring','summer','fall'];
const GENERIC=new Set(['pop','rock','electronic','dance','hip hop','hip-hop','alternative','indie','music']);
const JUNK=new Set(['girl group','boy group','idol','idols','male vocalists','female vocalists','seen live','singer','vocalist','group','duo','band','solo','music','pop music','00s','10s','20s','90s','80s','21st century','singer songwriter','blue eyed soul','songwriter','composer','producer','rapper','dj','musician','tiktok','viral','vocal','vocals']);
const PLACE=/^(american|british|english|canadian|australian|swedish|irish|scottish|welsh|german|french|japanese|chinese|taiwanese|thai|spanish|latin|mexican|brazilian|colombian|puerto rican|norwegian|danish|dutch|italian|usa|us|uk|united states|united kingdom|america|england|canada|australia|los angeles|new york|london|california|texas|nashville|atlanta|toronto|seoul)$/;
const ALIAS={synthpop:'synth pop','electro pop':'electropop',dancepop:'dance pop',hiphop:'hip hop',rap:'hip hop',rnb:'r&b','rhythm and blues':'r&b','alt rock':'alternative rock','indie folk pop':'indie folk'};
// user-typed junk: emails, links, decades, years, and sentences
const bad=t=>t.includes('@')||/https?:|www\.|\.(com|net|org)\b/.test(t)||/^\d{2,4}s?$/.test(t)||t.split(' ').length>3||/\b(i am|i m|fan|favou?rite|love[sd]?|awesome|best|beautiful|sexy|cute)\b/.test(t);
let GENRESET=null;                       // MusicBrainz's official genre list, downloaded once and saved in this browser
const norm=t=>t.toLowerCase().replace(/[-_]/g,' ').replace(/\s+/g,' ').trim();
async function loadGenreList(){
  let list=store.get('mbgenres');
  if(!list){ try{ const r=await fetch('https://musicbrainz.org/ws/2/genre/all?fmt=txt'); if(r.ok){list=(await r.text()).split('\n').filter(Boolean); store.set('mbgenres',list)} }catch(e){console.warn('genre list unavailable',e)} }
  if(list) GENRESET=new Set(list.map(norm));
}
const CANON=new Set(['k-pop','hip hop','r&b']);
function canon(tags){
  const n=tags.map(norm).filter(Boolean);
  if(n.some(t=>/\bk ?pop\b|\bkorea|\bkorean\b/.test(t)||/^\d+(st|nd|rd|th) gen/.test(t))) return ['k-pop'];   // every k-pop variant becomes one genre
  const mapped=n.map(t=>/hip hop/.test(t)?'hip hop':/r&b/.test(t)?'r&b':ALIAS[t]||t);
  return [...new Set(mapped.filter(t=>!JUNK.has(t)&&!PLACE.test(t)&&!bad(t)&&(CANON.has(t)||!GENRESET||GENRESET.has(t))))];   // keep only official genres
}
// each song counts once, under its artist's top-voted genre. If that is a broad one like "pop",
// use the most specific tag in the same family ("country pop", "indie pop") instead of jumping to an unrelated genre.
const mkGOf=genres=>{const memo={};return t=>memo[t.aid]??=(()=>{
  const g=canon(genres[t.aid]||[]); if(!g.length) return [];
  const p=g[0]; if(!GENERIC.has(p)) return [p];
  const fam=p.split(' ')[0];
  return [g.find(x=>x!==p&&x.split(' ').includes(fam))||p];
})()};
const seasonOf=d=>{const m=d.getMonth();return {s:m===11||m<2?0:m<5?1:m<8?2:3, y:m===11?d.getFullYear()+1:d.getFullYear()}}; // Dec belongs to the following winter
let DATA, VIEW='years', SEASON=-1;
function renderSeasons({tracks,genres,genresOk}){
  const gOf=mkGOf(genres), per={}, groups={};
  tracks.forEach(t=>{const k=dayKey(t.added);per[k]=(per[k]||0)+1});
  tracks.filter(t=>per[dayKey(t.added)]<25).forEach(t=>{const {s,y}=seasonOf(t.added);(groups[y*4+s]??={s,y,ts:[]}).ts.push(t)});
  const list=Object.entries(groups).sort((a,b)=>b[0]-a[0]).map(e=>e[1]).filter(g=>SEASON<0||g.s===SEASON);
  const bars=(rows,max,off)=>rows.map(([n,c],i)=>`<div class="bar"><em>${esc(n)}</em><u style="width:${Math.max(6,c/max*52)}%;background:${PALETTE[(i+off)%6]}"></u><small>${c}</small></div>`).join('');
  const chips=['all',...SEAS].map((n,i)=>`<button class="tab${SEASON===i-1?' on':''}" data-s="${i-1}">${n}</button>`).join('');
  const body=list.map(g=>{
    const topA=tally(g.ts,t=>t.artist).slice(0,8), topG=genresOk?tally(g.ts,gOf).slice(0,8):[];
    const picks=topA.map(([a])=>g.ts.find(t=>t.artist===a));
    const label=g.s===0?`${g.y-1}–${String(g.y).slice(2)}`:g.y;
    return `<section class="year sea"><div class="yh"><h2>${SEAS[g.s]}</h2><span>${label}, ${g.ts.length} songs</span></div>
      <div class="polas">${picks.map(cover).join('')}</div>
      <div class="cols"><div class="card"><h3>most saved</h3>${bars(topA,topA[0][1],0)}</div>
      <div class="card"><h3>genres</h3>${topG.length?bars(topG,topG[0][1],2):'<span class="empty">no genre data yet</span>'}</div></div></section>`}).join('');
  $('#strip').innerHTML='';
  $('#out').innerHTML=`<div class="chips">${chips}</div>`+(body||'<p class="empty">No saved songs in that season yet.</p>');
  status(`${tracks.length} songs saved`);
}
// ---- playlists page (only playlists you created; Spotify-made ones aren't shared with apps) ----
let PL=null, PLERR='', PLBUSY=false;
async function loadPlaylists(){
  PLBUSY=true; PLERR=''; PL=[];
  const cache=store.get('plc')||{};
  try{
    const me=await api('/me'); let url='/me/playlists?limit=50';
    while(url){
      const d=await api(url);
      d.items.filter(p=>p&&p.owner&&p.owner.id===me.id).forEach(p=>PL.push({id:p.id,name:p.name,img:p.images?.[0]?.url,snap:p.snapshot_id,n:(p.items||p.tracks)?.total??0}));
      url=d.next;
    }
    for(let i=0;i<PL.length;i++){
      const p=PL[i], c=cache[p.id]; status(`reading playlists… ${i+1}/${PL.length}`);
      let ok=true;
      if(c&&p.snap&&c.snap===p.snap){            // unchanged since last time: no Spotify requests needed
        if(c.start){p.start=new Date(c.start);p.end=new Date(c.end);p.top=c.top}
      }else{
        const dates=[], artists=[];
        try{
          let u=`/playlists/${p.id}/items?limit=100`, pages=0;
          while(u&&pages++<10){
            const d=await api(u);
            d.items.forEach(it=>{
              const t=it.item||it.track, when=it.added_at&&new Date(it.added_at);
              if(when&&when.getFullYear()>=2008) dates.push(when);   // very old items can carry a 1970 placeholder date
              if(t&&t.artists&&t.artists[0]) artists.push(t.artists[0].name);
            });
            u=d.next;
          }
        }catch(e){ if(e.quota) throw e; ok=false; console.warn('skipped playlist',p.name,e) }
        if(dates.length){dates.sort((a,b)=>a-b);p.start=dates[0];p.end=dates.at(-1);p.top=tally(artists,a=>a).slice(0,3).map(x=>x[0])}
      }
      p.done=true;
      if(p.start) p.live=p.end>Date.now()-30*864e5;
      if(ok){cache[p.id]={snap:p.snap,start:p.start,end:p.end,top:p.top}; store.set('plc',cache)}   // saved as we go
    }
    status(`${PL.filter(p=>p.start).length} playlists`);
  }catch(e){ PLERR=(e.quota||/Spotify is (asking|still)/.test(e.message))?e.message:"Spotify wouldn't share your playlists. Reload the page and connect again, and approve the playlist permission."; PL=null; console.warn(e); status(''); }
  PLBUSY=false; if(VIEW==='playlists') renderPlaylists();
}
function renderPlaylists(){
  $('#strip').innerHTML='';
  if(!PL||PLBUSY){ $('#out').innerHTML=`<p class="empty">${esc(PLERR||'Reading your playlists…')}</p>`; return; }
  const ready=PL.filter(p=>p.start), by={};
  const going=ready.filter(p=>p.live); ready.filter(p=>!p.live).forEach(p=>(by[p.start.getFullYear()]??=[]).push(p));
  const fmt=d=>d.toLocaleString('en',{month:'short',year:'numeric'});
  const row=p=>{const a=fmt(p.start),b=fmt(p.end);
    return `<div class="pl"><div class="pola"><i style="background:${p.img?`url(${p.img})`:PALETTE[p.name.length%6]};background-size:cover"></i><b>${p.n} songs</b></div>
    <div><h3>${esc(p.name)}</h3><span class="when">${p.live&&a!==b?`since ${a}, last added ${b}`:a}</span><p>${p.top.map(esc).join(', ')}</p></div></div>`};
  const ongoing=going.length?`<section class="year sea"><div class="yh"><h2>ongoing</h2><span>${going.length} playlist${going.length>1?'s':''}</span></div>
    <div class="pls">${going.sort((a,b)=>b.end-a.end).map(row).join('')}</div></section>`:'';
  const html=ongoing+Object.keys(by).sort((a,b)=>b-a).map(y=>`<section class="year"><div class="yh"><h2>${y}</h2><span>${by[y].length} playlist${by[y].length>1?'s':''}</span></div>
    <div class="pls">${by[y].sort((a,b)=>b.start-a.start).map(row).join('')}</div></section>`).join('');
  $('#out').innerHTML=html||'<p class="empty">No playlists found.</p>';
}
function render(d){
  DATA=d; $('#login').hidden=true; $('#nav').hidden=false;
  document.querySelectorAll('#nav .tab').forEach(b=>b.classList.toggle('on',b.dataset.v===VIEW));
  (VIEW==='years'?renderYears:VIEW==='seasons'?renderSeasons:renderPlaylists)(d);
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-v],[data-s]'); if(!b||!DATA) return;
  if(b.dataset.v){ VIEW=b.dataset.v; window.scrollTo(0,0); if(VIEW==='playlists'&&!PL&&!PLBUSY) loadPlaylists(); } else SEASON=+b.dataset.s;
  render(DATA);
});

// ---- genre fallback: MusicBrainz tags for each year's top artists (cached in this browser) ----
async function enrich(data){
  let cache={}; try{cache=JSON.parse(localStorage.getItem('mbg2')||'{}')}catch(e){}
  const seen={};
  [...new Set(data.tracks.map(t=>t.added.getFullYear()))].forEach(y=>{
    const ts=data.tracks.filter(t=>t.added.getFullYear()===y);
    tally(ts,t=>t.artist).slice(0,8).forEach(([a])=>{seen[ts.find(x=>x.artist===a).aid]=a});});
  // also each season's top 8 artists, so the seasons page uses its own data (bulk-save days left out, same as that page)
  const per={}, bySeason={};
  data.tracks.forEach(t=>{const k=dayKey(t.added);per[k]=(per[k]||0)+1});
  data.tracks.filter(t=>per[dayKey(t.added)]<25).forEach(t=>{const {s,y}=seasonOf(t.added);(bySeason[y*4+s]??=[]).push(t)});
  Object.values(bySeason).forEach(ts=>tally(ts,t=>t.artist).slice(0,8).forEach(([a])=>{seen[ts.find(x=>x.artist===a).aid]=a}));
  const list=Object.entries(seen), SKIP=new Set(['seen live','american','british','english','female vocalists','male vocalists','usa','uk','canadian','australian']);
  let done=0,found=0; data.loading=true;
  for(const [aid,name] of list){
    if(!(name in cache)){
      try{
        const r=await fetch('https://musicbrainz.org/ws/2/artist/?fmt=json&limit=1&query='+encodeURIComponent('artist:"'+name+'"'));
        const a=(await r.json()).artists?.[0];
        cache[name]=a&&a.score>=90?(a.tags||[]).sort((x,y)=>y.count-x.count).map(t=>t.name).filter(n=>!SKIP.has(n)).slice(0,6):[];
        try{localStorage.setItem('mbg2',JSON.stringify(cache))}catch(e){}
      }catch(e){console.warn('MusicBrainz lookup failed for',name,e)}
      await new Promise(r=>setTimeout(r,1100));
    }
    if(cache[name]?.length){data.genres[aid]=cache[name];found++}
    done++;
    if(done%12===0){data.genresOk=found>0;render(data)}
    status(`finding genres… ${done}/${list.length}`);
  }
  data.loading=false; data.genresOk=found>0; render(data);
}

// ---- boot ----
$('#login').onclick=login;
(async()=>{
  const code=new URLSearchParams(location.search).get('code');
  if(!code) return;
  history.replaceState({},'',location.pathname);
  try{ status('logging in…'); token=await exchange(code); const data=await loadReal(); await loadGenreList(); render(data); if(!data.genresOk) await enrich(data); }
  catch(e){ status(e.message); }
})();
